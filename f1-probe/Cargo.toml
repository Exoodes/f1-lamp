[package]
name = "f1-probe"
version = "0.1.0"
edition = "2021"
description = "PC tool: talks to F1's live timing feed and saves what arrives as .jsonStream captures"

[dependencies]
f1-core = { path = "../f1-core" }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Windows' own TLS (schannel); the rustls variant needs CMake and NASM to build.
tungstenite = { version = "0.30", features = ["native-tls"] }
ureq = "3"
