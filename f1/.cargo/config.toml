[build]
target = "riscv32imc-esp-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
# partitions.csv has two app slots for updates over WiFi. USB always writes
# slot ota_0, and erasing otadata makes the chip boot what was just flashed
# (after a WiFi update it could otherwise keep booting ota_1).
runner = "espflash flash --monitor --partition-table partitions.csv --target-app-partition ota_0 --erase-parts otadata"
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32c3"
ESP_IDF_VERSION = "v5.2"
ESP_IDF_TOOLS_INSTALL_DIR = "global"

# Uncomment this if you have moved the target dir by setting CARGO_TARGET_DIR or similar.
# Required for now due to embuild limitations.
#CARGO_WORKSPACE_DIR = { value = "", relative = true }