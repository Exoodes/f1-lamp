[build]
target = "riscv32imc-esp-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
# partitions.csv has two app slots for updates over WiFi. USB always writes
# slot ota_0, and erasing otadata makes the chip boot what was just flashed
# (after a WiFi update it could otherwise keep booting ota_1). The bootloader
# is ESP-IDF's own build, with the sdkconfig's rollback.
runner = "espflash flash --monitor --bootloader target/riscv32imc-esp-espidf/release/build/bootloader.bin --partition-table partitions.csv --target-app-partition ota_0 --erase-parts otadata"
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32c3"
ESP_IDF_VERSION = "v5.2.8"
ESP_IDF_TOOLS_INSTALL_DIR = "global"

[alias]
# `cargo ota [--features ...]`: build the release firmware and send it to the
# lamp over WiFi instead of USB; ota.ps1 is the runner that does the upload.
ota = ["run", "--release", "--config", '''target.'cfg(target_os = "espidf")'.runner = "powershell -NoProfile -ExecutionPolicy Bypass -File ota.ps1"''']
