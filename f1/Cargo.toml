[package]
name = "f1"
version = "0.1.0"
authors = ["Jakub Máca <jakub.maca@chyron.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "f1"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
smart-leds = "0.4"
ws2812-esp32-rmt-driver = { version = "0.14.0", features = ["smart-leds-trait"] }
f1-core = { path = "../f1-core" }
anyhow = "1.0.104"
serde_json = "1.0.151"
serde = "1.0.229"

[build-dependencies]
embuild = "0.33.5"
toml = "0.8"
# build.rs trims replay files with the same filter the replay uses.
f1-core = { path = "../f1-core" }

[features]
# Plays the session in `[replay] dir` of cfg.toml (or $F1_REPLAY_DIR) on the lamp.
replay = ["player"]
# Plays the hand-written showcase race in f1-core/tests/data/showcase.
showcase = ["player"]
# Connects to F1's live feed at once, whatever the schedule says: to test
# between sessions (the feed then holds the last session's state).
live-now = []
# A firmware that crashes 10 s after every boot: to test the update fallback.
# Only ever send it with `cargo ota --features crash-test`.
crash-test = []
# Internal: what every kind of replay needs. Not meant to be enabled by hand.
player = []

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.2" }

# The WebSocket client for F1's live feed (stage 6); since ESP-IDF 5 it is a
# separate component. After changing these, touch sdkconfig.defaults so
# ESP-IDF is rebuilt.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = "1.2" }
